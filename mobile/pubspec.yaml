name: wms_geology_mobile
description: "WMS Geology — мобильный клиент для Android-планшетов."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^7.4.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  # c-7d: открытие локальных PDF в системном вьювере.
  open_filex: ^4.5.0
  # c-7f: офлайн-рендер PDF этикетки.
  pdf: ^3.11.1
  qr: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # c-7f: шрифт с кириллицей для офлайн-рендера этикеток
    # (тот же файл, что у backend-рендера).
    - assets/fonts/DejaVuSans.ttf