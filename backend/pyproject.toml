[tool.poetry]
name = "wms-geology-backend"
version = "0.1.0"
description = "WMS Geology backend — Django + DRF"
authors = ["Илья Старыгин <ilia23star2@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2"
djangorestframework = "^3.15"
psycopg = {extras = ["binary"], version = "^3.2"}
django-environ = "^0.11"
qrcode = "^7.4"
pillow = "^10.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-django = "^4.9"
ruff = "^0.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ------------------------------------------------------------
# Ruff — линтер и форматтер
# ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

# ------------------------------------------------------------
# pytest — тесты
# ------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wms_geology.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["apps", "tests"]
addopts = "-v --tb=short --strict-markers"